spring.application.name=demo

# ── DATABASE CONFIG ──
# Railway automatically sets JDBC_DATABASE_URL, JDBC_DATABASE_USERNAME, JDBC_DATABASE_PASSWORD
# When running locally it falls back to your MySQL Workbench settings
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/TuitionSystem?createDatabaseIfNotExist=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:rafay123}

# ── DRIVER ──
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── HIBERNATE ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── SERVER PORT ──
# Railway sets PORT automatically, locally uses 8080
server.port=${PORT:8080}

# ── DISABLE open-in-view warning ──
spring.jpa.open-in-view=false